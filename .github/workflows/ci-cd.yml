name: Proventa CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://mock:mock@localhost:5432/proventa'

      - name: Run TypeScript Validation
        run: npm run typecheck

      - name: Run Test Suites
        run: npm run test
        env:
          NODE_ENV: test
          VITEST: 'true'

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://mock:mock@localhost:5432/proventa'
          NEXT_TELEMETRY_DISABLED: 1
          FEATURE_WAVE1_REGISTRATION: 'true'

