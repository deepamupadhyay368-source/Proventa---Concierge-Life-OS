name: Proventa CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: 'postgresql://ci_user:ci_pass@localhost:5432/proventa?schema=public'
      AUTH_SECRET: 'ci_mock_auth_secret_minimum_32_characters_long_for_test'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      FEATURE_WAVE1_REGISTRATION: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Validation
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test

      - name: Production Build
        run: npm run build
