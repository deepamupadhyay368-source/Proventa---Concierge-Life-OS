name: Proventa CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proventa_ci
          POSTGRES_PASSWORD: proventa_ci_password_mock
          POSTGRES_DB: proventa_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://proventa_ci:proventa_ci_password_mock@localhost:5432/proventa_ci_db?schema=public'
      AUTH_SECRET: 'ci_mock_auth_secret_minimum_32_characters_long_for_test'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_TELEMETRY_DISABLED: 1
      FEATURE_WAVE1_REGISTRATION: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Ephemeral CI Database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
        env:
          NODE_ENV: development
          SEED_DEV_ADMIN_PASSWORD: 'CiSeedPass_Mock12345!Aa1'

      - name: Run TypeScript Validation
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test
        env:
          NODE_ENV: test

      - name: Production Build
        run: npm run build
        env:
          NODE_ENV: production
